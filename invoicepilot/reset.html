<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Nettoyage du cache InvoicePilot</title>
    <style>
        body { font-family: -apple-system, Inter, Arial, sans-serif; background: #F1F5F9; color: #1E293B; padding: 40px; text-align: center; }
        h1 { color: #4F46E5; }
        .spinner { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #E2E8F0; border-top-color: #4F46E5; animation: s .8s linear infinite; margin: 30px auto; }
        @keyframes s { to { transform: rotate(360deg); } }
        .status { margin-top: 16px; color: #64748B; font-size: 14px; }
        .done { color: #10B981; font-weight: 600; }
        a { display: inline-block; margin-top: 20px; padding: 12px 24px; background: #4F46E5; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <h1>Nettoyage en cours…</h1>
    <div class="spinner" id="spin"></div>
    <div class="status" id="status">Désinscription du service worker…</div>
    <div id="link" style="display:none">
        <p class="done">Cache nettoyé !</p>
        <a href="app.html">Ouvrir InvoicePilot</a>
    </div>
<script>
(async function () {
    var status = document.getElementById("status");
    function setStatus(t) { status.textContent = t; }
    try {
        if ("serviceWorker" in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) await regs[i].unregister();
            setStatus("Service workers désinscrits (" + regs.length + ")");
        }
        if ("caches" in window) {
            var keys = await caches.keys();
            for (var j = 0; j < keys.length; j++) await caches.delete(keys[j]);
            setStatus("Caches supprimés (" + keys.length + ")");
        }
        try { sessionStorage.clear(); } catch (e) {}
        // localStorage gardé volontairement : il contient le flag du tour onboarding, etc.
        setTimeout(function () {
            document.getElementById("spin").style.display = "none";
            document.getElementById("link").style.display = "block";
            // Redirige automatiquement vers app.html avec cache-bust
            window.location.replace("app.html?fresh=" + Date.now());
        }, 800);
    } catch (e) {
        setStatus("Erreur : " + e.message + ". Cliquez le bouton ci-dessous.");
        document.getElementById("spin").style.display = "none";
        document.getElementById("link").style.display = "block";
    }
})();
</script>
</body>
</html>
